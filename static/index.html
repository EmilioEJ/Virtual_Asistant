<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - Asistente Universitario</title>
    <meta name="description" content="Aria, el Asistente Virtual inteligente de la carrera de Tecnologías de la Información de la Universidad Indoamérica.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=6.0">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Three.js y VRM para el Avatar -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.js"
          }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Panel Izquierdo: Chat -->
        <main class="chat-panel">
            <header>
                <div class="logo-area">
                    <div class="logo-title-group">
                        <h1 class="brand-title">ARIA</h1>
                    </div>
                    <p class="subtitle">Tu asistente virtual de la carrera en Tecnologías de la Información</p>
                </div>
                
                <div class="header-actions">
                    <!-- Theme Toggle -->
                    <button id="themeToggleBtn" class="header-btn header-btn-theme" title="Cambiar tema">
                        <svg class="btn-icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/>
                            <line x1="12" y1="1" x2="12" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="3" y2="12"/>
                            <line x1="21" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                        </svg>
                    </button>

                    <a href="/admin.html" class="header-btn header-btn-primary" id="adminBtn" style="display: none;">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                        Admin RAG
                    </a>
                    <button onclick="logout()" class="header-btn header-btn-danger">
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Salir
                    </button>
                </div>
            </header>
            
            <nav class="mode-selector">
                <button id="modeChatBtn" class="mode-btn">Chatear</button>
                <button id="modeConvBtn" class="mode-btn active">Conversar</button>
            </nav>

            <div id="chatModeContainer" class="mode-container hidden-mode">
                <div class="chat-box" id="chatBox">
                    <!-- Los mensajes del chat irán aquí -->
                </div>

                <div class="input-area">
                    <button id="micBtn" class="mic-btn" title="Activar micrófono">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                        </svg>
                    </button>
                    <input type="text" id="userInput" placeholder="Escribe tu pregunta..." autocomplete="off">
                    <button id="sendBtn" title="Enviar texto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>

            <div id="convModeContainer" class="mode-container active-mode">
                <div class="conversational-ui">
                    <div class="conv-status" id="convStatus">Toca el micrófono para hablar con Aria</div>
                    <button id="bigMicBtn" class="big-mic-btn" title="Iniciar Conversación">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M12 1a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V5a4 4 0 0 0-4-4z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                        </svg>
                    </button>
                    <div class="conv-waves" id="convWaves">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Panel Derecho: Visor 3D -->
        <aside class="avatar-panel">
            <div id="canvas-container"></div>
            
            <!-- Capa de Subtítulos -->
            <div id="subtitles-container" class="subtitles-overlay hidden" aria-live="polite">
                <div class="subtitles-card">
                    <span class="subtitles-speaker"><span class="speaker-dot"></span>ARIA</span>
                    <p id="subtitles-text"></p>
                </div>
            </div>
            
            <!-- HUD con iconos modernos -->
            <div class="hud-overlay">
                <!-- Status (eye icon) -->
                <div class="hud-box active" id="statusIndicator" title="Estado del sistema: Online">
                    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </div>

                <!-- Camera toggle -->
                <div class="hud-box active" id="toggleCameraBtn" style="cursor: pointer; position: relative;" title="Encender/Apagar Cámara Web">
                    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M23 7l-7 5 7 5V7z"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                </div>

                <!-- Subtitles toggle -->
                <div class="hud-box active" id="toggleSubtitlesBtn" style="cursor: pointer; position: relative;" title="Mostrar/Ocultar Subtítulos">
                    <svg class="hud-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M7 15h4M13 15h4M7 11h10"/>
                    </svg>
                </div>
            </div>

            <!-- Carrusel de preguntas sugeridas -->
            <div class="suggestion-wrapper">
                <div class="suggestion-header">
                    <p class="suggestion-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10.7l-5.1 3.7L16.8 20 12 16.6 7.2 20l1.9-5.6L4 10.7l6.1-1.9z"/></svg>
                        Preguntas sugeridas
                    </p>
                    <div class="suggestion-nav">
                        <button class="suggestion-arrow" id="sugPrev" type="button" aria-label="Pregunta anterior">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        <button class="suggestion-arrow" id="sugNext" type="button" aria-label="Pregunta siguiente">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>
                <div class="suggestion-viewport" id="suggestionViewport">
                    <div class="suggestion-cloud" id="suggestionTrack">
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿Cuánto cuesta la matrícula en la modalidad presencial?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿Qué nivel de inglés necesito para graduarme?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿Qué materias veré o cómo es la malla curricular?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿Qué becas o ayudas económicas ofrece la universidad?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿En qué consiste el examen de ubicación diagnóstica?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿Qué pasa si repruebo una materia?</button>
                        <button class="suggestion-bubble" onclick="askSuggestion(this)">¿En qué modalidades se ofrece esta carrera?</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlEl = document.documentElement;

        // Sun SVG
        const sunSVG = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
        // Moon SVG
        const moonSVG = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

        // Load saved theme
        const savedTheme = localStorage.getItem('aria-theme') || 'dark';
        htmlEl.setAttribute('data-theme', savedTheme);
        themeIcon.innerHTML = savedTheme === 'dark' ? sunSVG : moonSVG;

        themeToggleBtn.addEventListener('click', () => {
            const current = htmlEl.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', next);
            localStorage.setItem('aria-theme', next);
            themeIcon.innerHTML = next === 'dark' ? sunSVG : moonSVG;
        });

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (e) {
                console.error(e);
            }
        }
    </script>
    <script type="module" src="/static/script.js?v=6.0"></script>
</body>
</html>
