<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - Panel de Administración</title>
    <link rel="stylesheet" href="/static/style.css?v=5.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-main);
            font-family: 'Outfit', sans-serif;
            color: var(--text-main);
        }

        .admin-container {
            background: var(--bg-panel);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 8px 32px var(--shadow-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .status-card {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 16px 20px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drop-zone {
            border: 2px dashed var(--text-muted);
            border-radius: 16px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: var(--bg-input);
        }

        .drop-zone.dragover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .drop-zone p {
            margin: 10px 0;
            color: var(--text-muted);
        }

        #fileInput { display: none; }

        .file-list {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-badge {
            background: var(--primary-soft);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--primary);
        }

        .btn-upload {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: var(--transition-smooth);
            margin-top: 10px;
        }

        .btn-upload:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 76, 154, 0.3);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--text-muted);
        }

        /* Terminal de progreso */
        .progress-container {
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .progress-bar {
            height: 8px;
            background: var(--glass-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .terminal-logs {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #4ade80;
        }

        .terminal-logs p { margin: 2px 0; }
        
        .header-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 400;
            transition: var(--transition-smooth);
            font-size: 0.95rem;
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-links">
            <h1>Base de Conocimiento (RAG)</h1>
            <a href="/" class="back-link">← Volver al Asistente</a>
        </div>
        
        <div class="status-card">
            <div>
                <strong>Estado Actual de la Base de Datos:</strong>
                <div id="dbStatusText" style="color: #d1bdf5; font-size: 0.9rem;">Cargando...</div>
            </div>
            <div>
                <span id="dbBadge" style="background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px; font-size: 0.8rem;">? Fragmentos</span>
            </div>
        </div>

        <div id="uploadSection">
            <div class="drop-zone" id="dropZone">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Arrastra tus archivos PDF aquí</p>
                <p style="font-size: 0.8rem;">O haz clic para seleccionar (Se reemplazarán los datos actuales)</p>
                <input type="file" id="fileInput" accept="application/pdf" multiple>
            </div>
            
            <div class="file-list" id="fileList"></div>
            
            <button class="btn-upload" id="uploadBtn" disabled>Procesar e Indexar Documentos</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <h3 style="margin:0; font-size: 1rem; color: var(--text-main);">Procesando Documentos...</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="terminal-logs" id="terminalLogs">
                <p>> Esperando inicio del proceso...</p>
            </div>
        </div>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
